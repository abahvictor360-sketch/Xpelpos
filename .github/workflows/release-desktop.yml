# Builds the Windows installer and portable exe and attaches them, with the
# auto-update feed (latest.yml), to the GitHub release for the pushed tag.
# The /download page and installed tills both read from that release.
#
# To ship: bump "version" in package.json and merge, then either push a
# matching tag (`git tag v1.0.10 && git push origin v1.0.10`) or run this
# workflow from the Actions tab, which creates the v<version> release itself.
name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci

      - name: Build
        run: npm run export:desktop && npx electron-builder --win --publish never

      # Published by hand rather than by electron-builder: its installer and
      # portable targets race to create the release and one of them fails.
      # Any existing release for the tag is replaced (the tag is kept), since a
      # half-finished upload leaves hidden assets that block re-uploading.
      # The new release stays a draft until every file, latest.yml last, is up,
      # so neither the /download page nor the updater sees it half-built.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" \
            "release/Xpel-POS-Setup-$version.exe" \
            "release/Xpel-POS-Setup-$version.exe.blockmap" \
            "release/Xpel-POS-$version-portable.exe" \
            --draft --target "$GITHUB_SHA" --title "$version" --generate-notes
          gh release upload "$tag" release/latest.yml
          gh release edit "$tag" --draft=false --latest
